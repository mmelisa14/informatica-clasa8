<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atelier HTML</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
/* Layout: bară laterală cu lecțiile + coloană de lucru. În coloană: foaia cu explicații (margine roșie ca la caiet), apoi atelierul: editor | previzualizare, iar dedesubt controale și provocări. */
:root{
  --bg:#F1F4EA; --grid:#E0E6D4; --sheet:#FCFDF8; --fg:#15203A; --muted:#566280; --line:#CFD6C2;
  --accent:#1D4ED8; --accent-fg:#FFFFFF; --accent-soft:#DCE6FB;
  --red:#C62839; --red-soft:#EDB3BB; --hl:#FFE45C; --hl-soft:#FFF1A0; --attr-c:#9A5B00;
  --ok:#1B8A52; --ok-fg:#FFFFFF; --ok-soft:#D5F0E1;
  --ed-bg:#17213A; --ed-fg:#E7ECF7; --ed-gut:#7F8CAB; --ed-line:#26324F; --ed-sel:#5B84E066;
  --t-tag:#FF8FA6; --t-attr:#FFD479; --t-str:#8EE6B4; --t-com:#7B88A8; --t-css:#8DB8FF; --t-doc:#B9A0FF;
  --chrome:#DCE1D0; --win:#FFFFFF; --win-fg:#1A1A1A; --win-mut:#6B7280;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --code-size:14px; --cs:var(--code-size); --ws-h:26rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --grid:#141C31; --sheet:#141B2E; --fg:#E7EBF6; --muted:#98A4C4; --line:#27314D;
    --accent:#7EA2FF; --accent-fg:#0D1322; --accent-soft:#1B2850;
    --red:#FF7A8A; --red-soft:#5A2A35; --hl:#6F5F12; --hl-soft:#4A4210; --attr-c:#FFC46B;
    --ok:#4ADE9A; --ok-fg:#0D1322; --ok-soft:#173A2C;
    --ed-bg:#0A0F1D; --ed-fg:#E7ECF7; --ed-gut:#6B7899; --ed-line:#1B2540; --ed-sel:#5B84E077;
    --chrome:#1D2640;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --grid:#141C31; --sheet:#141B2E; --fg:#E7EBF6; --muted:#98A4C4; --line:#27314D;
  --accent:#7EA2FF; --accent-fg:#0D1322; --accent-soft:#1B2850;
  --red:#FF7A8A; --red-soft:#5A2A35; --hl:#6F5F12; --hl-soft:#4A4210; --attr-c:#FFC46B;
  --ok:#4ADE9A; --ok-fg:#0D1322; --ok-soft:#173A2C;
  --ed-bg:#0A0F1D; --ed-fg:#E7ECF7; --ed-gut:#6B7899; --ed-line:#1B2540; --ed-sel:#5B84E077;
  --chrome:#1D2640;
  color-scheme:dark;
}
@media (max-width:700px){:root{--cs:max(var(--code-size),16px)}}

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.present{font-size:18px;--ws-h:34rem}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--fg);
  font:400 1rem/1.6 var(--sans);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:500 .88em var(--mono);background:var(--accent-soft);padding:.1em .38em;border-radius:3px;overflow-wrap:anywhere}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .1em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:2rem;max-width:1480px;margin:0 auto}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:1.1rem;max-height:calc(100vh - 40px);overflow-y:auto;padding-right:2px}
.brand{font:800 1.75rem/1 var(--disp);letter-spacing:-.02em;margin:0}
.brand span{color:var(--accent)}
.sub{margin:.35rem 0 0;color:var(--muted);font-size:.9rem}
.prog{display:flex;flex-direction:column;gap:.35rem;font:500 .78rem var(--mono);color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nl{display:grid;grid-template-columns:1.9rem minmax(0,1fr) 1rem;align-items:center;gap:.35rem;width:100%;padding:.45rem .55rem;border:0;border-radius:6px;background:transparent;text-align:left}
.nl:hover{background:var(--accent-soft)}
.nl .n{font:600 .8rem var(--mono);color:var(--muted)}
.nl .tt{font-size:.93rem;line-height:1.25}
.nl .ck{font-size:.85rem;color:var(--ok);text-align:center}
.nl.dn .ck::before{content:"✓"}
.nl.on{background:var(--accent);color:var(--accent-fg)}
.nl.on .n,.nl.on .ck{color:inherit}
.nl.free{margin-top:.5rem;border:1px dashed var(--line)}

.main{min-width:0;display:flex;flex-direction:column;gap:1.75rem}
.top{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:.4rem .8rem;font-size:.88rem;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.lh{display:flex;flex-direction:column;gap:.6rem}
.kick{margin:0;font:600 .78rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.lh h1{margin:0;font:800 clamp(2.1rem,5vw,3.4rem)/1.02 var(--disp);letter-spacing:-.025em;text-wrap:balance}
.lead{margin:0;font-size:1.15rem;max-width:60ch;color:var(--muted)}

.sheet{position:relative;display:flex;flex-direction:column;gap:1rem;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1.5rem 1.5rem 1.6rem 3.6rem}
.sheet::before{content:"";position:absolute;left:2.4rem;top:0;bottom:0;width:1px;background:var(--red-soft)}
.sheet>*{margin:0;min-width:0}
.sheet>:is(p,ul,ol){max-width:66ch}
.sheet h2{font:700 1.45rem/1.2 var(--disp);letter-spacing:-.01em;margin-top:.9rem;text-wrap:balance}
.sheet>h2:first-child{margin-top:0}
.sheet ul{padding-left:1.2rem;display:flex;flex-direction:column;gap:.3rem}
@media (max-width:700px){.sheet{padding:1.1rem 1rem 1.2rem 2.4rem}.sheet::before{left:1.6rem}}

.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.75rem}
.cmd{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:.7rem .85rem;display:flex;flex-direction:column;gap:.2rem;min-width:0}
.cmd b{font:600 1rem var(--mono);color:var(--accent);overflow-wrap:anywhere}
.cmd span{font-size:.9rem;color:var(--muted)}
.sec-t{display:flex;align-items:baseline;gap:.75rem;margin:0 0 .6rem;font:700 1.15rem var(--disp)}
.sec-t small{font:500 .85rem var(--sans);color:var(--muted)}

/* widgets */
.wg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1rem;display:flex;flex-direction:column;gap:.85rem;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:.4rem .75rem;font-size:.9rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cap{margin:0;font-size:.95rem}
.cline{font:600 clamp(1rem,3.6vw,1.6rem)/1.7 var(--mono);display:flex;flex-wrap:wrap;align-items:baseline;overflow-wrap:anywhere}
.sg{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:0 1px;color:var(--fg);white-space:pre-wrap}
.sg[data-k="open"],.sg[data-k="close"]{color:var(--accent)}
.sg[data-k="attr"]{color:var(--attr-c)}
.sg.on{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.stage{background:var(--win);color:var(--win-fg);border:1px solid var(--line);border-radius:6px;padding:1.25rem;min-height:11.5rem;display:grid;place-items:center}
.mini{width:min(100%,20rem)}
.mini .cnt{display:none;margin:.6rem 0 0}
.stage[data-layer="html"] .mini :is(h3,p,button){all:revert}
.stage[data-layer="html"] .mini :is(h3,p){color:var(--win-fg)}
.stage:not([data-layer="html"]) .mini{background:#FFF4E5;border:2px solid #F59E0B;border-radius:14px;padding:1rem 1.25rem}
.stage:not([data-layer="html"]) .mini h3{margin:0 0 .25rem;font:700 1.3rem var(--disp);color:#B45309}
.stage:not([data-layer="html"]) .mini p{margin:0 0 .75rem;color:#44403C}
.stage:not([data-layer="html"]) .mini button{background:#F59E0B;border:0;border-radius:999px;padding:.5rem 1.1rem;font-weight:600;color:#1C1917}
.stage[data-layer="js"] .mini p.cnt{display:block;font-weight:600;margin:.75rem 0 0}
.create{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.5rem}
.create button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:.55rem .7rem;text-align:left;font-weight:500;font-size:.92rem}
.create button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.flow div{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:.8rem;display:flex;flex-direction:column;gap:.3rem;font-size:.93rem}
.flow b{font:600 .8rem var(--mono);color:var(--red);letter-spacing:.08em}
@media (max-width:700px){.flow{grid-template-columns:1fr}}
.mix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:700px){.mix{grid-template-columns:1fr}}
.mix .sl{display:grid;grid-template-columns:1.4rem minmax(0,1fr) 2.6rem;gap:.5rem;align-items:center;font:500 .85rem var(--mono)}
.mix .sl output{text-align:right}
.swatch{height:4.5rem;border-radius:6px;border:1px solid var(--line)}
.mix .out{display:flex;flex-direction:column;gap:.4rem}
.mix .out code{background:var(--sheet);border:1px solid var(--line);font-size:.95rem;padding:.3rem .5rem}
.xp{margin:0;background:var(--ed-bg);color:var(--ed-fg);border-radius:6px;padding:.7rem 0;font:400 .92rem/1.7 var(--mono);overflow-x:auto}
.xp .ln{display:block;padding:0 1rem;white-space:pre}
.xp .ln.on{background:#FFE45C33}


.tw{overflow-x:auto;max-width:100%}
table.ref{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--sheet)}
.ref th,.ref td{border:1px solid var(--line);padding:.45rem .7rem;text-align:left;vertical-align:top}
.ref th{background:var(--accent-soft);font-weight:600}
.props-d{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.props-d>summary{cursor:pointer;padding:.85rem 1rem;font:700 1.15rem var(--disp);list-style:none;display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.props-d>summary::-webkit-details-marker{display:none}
.props-d>summary::before{content:"▸";color:var(--accent)}
.props-d[open]>summary::before{content:"▾"}
.props-d>summary small{font:500 .85rem var(--sans);color:var(--muted)}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr));gap:.9rem;padding:0 1rem 1rem}
.props.solo{padding:0}
.pc{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.pn{font:600 1.02rem var(--mono);color:var(--accent);background:none;padding:0;overflow-wrap:anywhere}
.pk{font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.pk-css{color:var(--accent);border-color:var(--accent)}
.pk-val{color:var(--attr-c);border-color:var(--attr-c)}
.pk-html{color:var(--red);border-color:var(--red)}
.pd{margin:0;font-size:.93rem}
.pv{margin:0;display:grid;gap:.25rem;font-size:.88rem}
.pv>div{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:.6rem;border-top:1px dashed var(--line);padding-top:.25rem}
.pv dt,.pv dd{margin:0;min-width:0}
.pv dt code{background:none;padding:0;color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.pe{margin:0;background:var(--ed-bg);color:var(--ed-fg);border-radius:5px;padding:.6rem .8rem;font:400 .82rem/1.6 var(--mono);overflow-x:auto;white-space:pre}
.pt{margin:0;font-size:.88rem;background:var(--hl-soft);border-radius:4px;padding:.4rem .6rem}
.pa{margin-top:auto;padding-top:.2rem}
.mist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:1rem}
.mi{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.mi-c{display:flex;flex-direction:column;gap:.3rem}
.mi-w{margin:0;font-size:.9rem}
.bad,.good{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.bad{color:var(--red)}
.good{color:var(--ok)}
.dq{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end}
.bm{display:grid;place-items:center;padding:.5rem 0;overflow-x:auto}
.bm-m{background:#F9CC9D;padding:24px;position:relative}
.bm-b{background:#FDDD9B;border:8px solid #D9A441;position:relative}
.bm-p{background:#C3D08B;padding:20px;position:relative}
.bm-c{background:#8CB6C0;color:#10343C;padding:.9rem 1.5rem;font:600 .85rem var(--mono);text-align:center}
.bm-l{position:absolute;top:2px;left:5px;font:600 .62rem var(--mono);color:#3b2a14;text-transform:uppercase;letter-spacing:.06em}
.bm-sl{display:grid;grid-template-columns:5rem minmax(0,1fr) 3.2rem;gap:.5rem;align-items:center;font:500 .85rem var(--mono)}
.bm-sl output{text-align:right}

/* atelier */
.lab{display:flex;flex-direction:column;gap:1rem}
.lab-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem}
.lab-bar h2{margin:0;font:700 1.35rem var(--disp)}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;height:var(--ws-h);min-height:0;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
@media (max-width:900px){.pane{height:22rem}}
.ph{display:flex;align-items:flex-end;gap:.75rem;padding:.45rem .75rem 0;background:var(--ed-line)}
.ph .ft{background:var(--ed-bg);color:var(--ed-fg);font:500 .8rem var(--mono);padding:.4rem .9rem;border-radius:6px 6px 0 0}
.ph .hint-e{margin-left:auto;font-size:.72rem;color:var(--ed-gut);padding-bottom:.4rem;text-align:right}
.edbox{flex:1;display:flex;min-height:0;background:var(--ed-bg)}
.edbox:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.gut{width:3rem;flex:none;padding:12px 10px 12px 0;text-align:right;color:var(--ed-gut);font:400 var(--cs)/1.65 var(--mono);white-space:pre;overflow:hidden;user-select:none;border-right:1px solid var(--ed-line)}
.edin{position:relative;flex:1;min-width:0}
.edin pre,.edin textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font:400 var(--cs)/1.65 var(--mono);white-space:pre;tab-size:2;border:0;background:transparent;overflow:auto;border-radius:0}
.edin pre{pointer-events:none;color:var(--ed-fg);overflow:hidden}
.edin textarea{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ed-fg);resize:none;outline:none}
.edin textarea::selection{background:var(--ed-sel)}
.edin pre i{font-style:normal}
.t{color:var(--t-tag)}.a{color:var(--t-attr)}.s{color:var(--t-str)}.c{color:var(--t-com)}.p{color:var(--t-css)}.sel{color:var(--t-attr)}.d{color:var(--t-doc)}
.pv{background:var(--win)}
.chrome{display:flex;align-items:flex-end;gap:.75rem;padding:.45rem .75rem 0;background:var(--chrome)}
.dots{display:flex;gap:5px;padding-bottom:.65rem}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.45}
.tab{background:var(--win);color:var(--win-fg);font-size:.8rem;padding:.4rem .9rem;border-radius:8px 8px 0 0;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{padding:.35rem .75rem;background:var(--win);border-bottom:1px solid #0001;font:.74rem var(--mono);color:var(--win-mut)}
.pv iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
.files{display:flex;flex-direction:column;gap:.5rem}
.files .row{display:flex;flex-wrap:wrap;gap:.6rem}
.files button{display:flex;flex-direction:column;align-items:center;gap:.25rem;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:.4rem;font:500 .78rem var(--mono)}
.files button:hover{border-color:var(--accent)}
.files img{width:64px;height:64px;border-radius:4px;display:block}
.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
.under.one{grid-template-columns:1fr}
@media (max-width:900px){.under{grid-template-columns:1fr}}
.box-p{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.8rem;min-width:0}
.box-p h3{margin:0;font:700 1.1rem var(--disp)}
.box-p .note{margin:0;font-size:.88rem;color:var(--muted)}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.th .cnt{font:600 .82rem var(--mono);color:var(--red)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.85rem}
.ctl{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.ctl label{font:600 .82rem var(--sans)}
.ctl .row{display:flex;align-items:center;gap:.6rem}
.ctl input[type=color]{width:2.6rem;height:2.2rem;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--sheet)}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctl input[type=text],.ctl select{width:100%;font:inherit;font-size:.92rem;padding:.4rem .55rem;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.ctl .val{background:none;padding:0;font-size:.82rem;color:var(--muted);min-width:3.4rem}
.ctl.off{opacity:.45}
.sw{display:flex;flex-wrap:wrap;gap:.35rem}
.swb{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid var(--line);padding:0}
.swb:hover{border-color:var(--fg)}
.tasks-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7rem}
.tk{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.65rem;align-items:start}
.tk .box{width:1.3rem;height:1.3rem;margin-top:.15rem;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;font-size:.8rem;line-height:1}
.tk.ok .box{background:var(--ok);border-color:var(--ok);color:var(--ok-fg);animation:pop .35s}
.tk.ok .box::before{content:"✓"}
.tk .tx{margin:0}
.hint{font-size:.88rem;color:var(--muted)}
.hint summary{cursor:pointer;width:max-content;color:var(--red);font-weight:500}
.hint p{margin:.3rem 0 0}

<script>
(function(){
'use strict';
document.documentElement.lang='ro';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
var qa=function(s){return esc(s).replace(/"/g,'&quot;')};
var fmt=function(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')};
var OC='<'+'!--';

/* ---------- stare salvată ---------- */
var KEY='atelier-html-v1';
var S={code:{},done:{},font:14,theme:'',present:false};
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw));}}catch(e){}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}

/* ---------- imagini disponibile în lecții ---------- */
var svg=function(s){return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)};
var IMGS={
 'soare.svg':svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#BFE3FF"/><g stroke="#F59E0B" stroke-width="6" stroke-linecap="round"><path d="M60 12v14M60 94v14M12 60h14M94 60h14M26 26l10 10M84 84l10 10M94 26l-10 10M36 84l-10 10"/></g><circle cx="60" cy="60" r="24" fill="#FBBF24"/></svg>'),
 'luna.svg':svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#1E2A5A"/><circle cx="56" cy="62" r="30" fill="#FDE68A"/><circle cx="70" cy="52" r="26" fill="#1E2A5A"/><circle cx="26" cy="24" r="3" fill="#fff"/><circle cx="96" cy="30" r="2.5" fill="#fff"/><circle cx="88" cy="94" r="3" fill="#fff"/></svg>'),
 'casa.svg':svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#DFF3E3"/><rect x="26" y="54" width="68" height="48" fill="#E4572E"/><path d="M18 56L60 20l42 36z" fill="#3D2B56"/><rect x="52" y="72" width="16" height="30" fill="#FDE68A"/><rect x="32" y="64" width="14" height="14" fill="#BFE3FF"/><rect x="74" y="64" width="14" height="14" fill="#BFE3FF"/></svg>'),
 'copac.svg':svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#E6F4FF"/><rect x="54" y="62" width="12" height="42" fill="#7C4A21"/><circle cx="60" cy="48" r="26" fill="#2E9E5B"/><circle cx="42" cy="58" r="16" fill="#38B26A"/><circle cx="78" cy="58" r="16" fill="#38B26A"/></svg>')
};
var IMG_ALT={'soare.svg':'Un soare galben','luna.svg':'Luna pe cerul de noapte','casa.svg':'O căsuță roșie','copac.svg':'Un copac verde'};
function withImages(code){
  return code.replace(/(\bsrc\s*=\s*["'])([^"']+)(["'])/gi,function(m,a,n,b){var k=n.trim();return IMGS[k]?a+IMGS[k]+b:m})
    .replace(/url\(\s*(["']?)([^)"']+)\1\s*\)/gi,function(m,q,n){var k=n.trim();return IMGS[k]?'url("'+IMGS[k]+'")':m});
}

/* ---------- schelet de pagină folosit în lecții ---------- */
function sk(body,o){o=o||{};
  return '<!DOCTYPE html>\n<html lang="ro">\n<head>\n  <meta charset="UTF-8">\n  <title>'+(o.title||'Pagina mea')+'</title>'+(o.head||'')+'\n</head>\n<body'+(o.battr||'')+'>\n'+body+'\n</body>\n</html>';
}

/* ---------- LECȚII ---------- */
var LESSONS=[

/* 0 */
{id:'lectia-0',num:0,nav:'Ce este HTML?',title:'Ce este HTML?',
 lead:'Începem de la zero: ce este, la ce ne ajută și cum arată primul cod. Totul se poate încerca pe loc.',
 intro:
 '<h2>Un limbaj de marcare, nu de programare</h2>'+
 '<p><mark>HTML</mark> vine de la <em>HyperText Markup Language</em>, adică „limbaj de marcare a textului”. Nu îi dai ordine calculatorului. Îi spui browserului ce este fiecare bucată din pagină: asta e un titlu, asta e o poză, asta e un buton.</p>'+
 '<p>Gândește-te la un document Word. Selectezi un rând și îl faci „Titlu”, alt text îl faci „Listă”. HTML face același lucru, dar eticheta o scrii cu mâna, în text simplu. Apasă pe părțile de mai jos ca să vezi din ce e făcută o etichetă.</p>'+
 '<div class="wg" data-wg="anat"></div>'+
 '<h2>Trei straturi, ca la o casă</h2>'+
 '<p>O pagină web se construiește din trei limbaje care lucrează împreună: zidurile (HTML), vopseaua și mobila (CSS) și instalația electrică (JavaScript). Apasă pe butoane și vezi aceeași pagină în trei etape.</p>'+
 '<div class="wg" data-wg="layers"></div>'+
 '<p>În acest curs învățăm <mark>HTML</mark> și primele comenzi de <mark>CSS</mark>: culori, fundal, text. JavaScript vine după.</p>'+
 '<h2>Ce putem crea cu HTML?</h2>'+
 '<div class="wg" data-wg="create"></div>'+
 '<h2>Cum ajunge codul pe ecran?</h2>'+
 '<div class="flow"><div><b>PASUL 1</b>Scrii codul într-un fișier text cu extensia <code>.html</code>.</div><div><b>PASUL 2</b>Browserul citește fișierul de sus în jos, rând cu rând.</div><div><b>PASUL 3</b>Desenează pe ecran fiecare element, în ordinea în care apare.</div></div>'+
 '<h2>Ce ai nevoie ca să începi</h2>'+
 '<ul><li>Un editor de text: Notepad, sau mai bine Visual Studio Code.</li><li>Un browser: Chrome, Edge sau Firefox.</li><li>Salvezi fișierul ca <code>pagina.html</code> și îl deschizi cu dublu-click.</li></ul>'+
 '<p>Mai jos ai atelierul. Scrii cod în stânga, iar în dreapta pagina se actualizează pe loc. Rezolvă cele trei provocări.</p>',
 cmds:[{t:'<h1>',d:'Titlu principal'},{t:'<p>',d:'Paragraf de text'},{t:'<strong>',d:'Text îngroșat, important'}],
 starter:'<h1>Salut, lume!</h1>\n<p>Aceasta este prima mea pagină HTML.</p>',
 controls:[{type:'text',label:'Textul titlului (h1)',re:/(<h1>)([^<]*)(<\/h1>)/}],
 tasks:[
  {text:'Schimbă textul din titlul `h1` cu numele tău.',hint:'Șterge „lume” din prima linie și scrie în loc numele tău. Lasă `<h1>` și `</h1>` neatinse.',
   test:function(c){var h=c.q('h1');return !!h&&h.textContent.trim()!==''&&h.textContent.trim()!=='Salut, lume!'}},
  {text:'Adaugă un al doilea paragraf între `<p>` și `</p>`.',hint:'Pe un rând nou scrie `<p>Textul tău</p>`.',
   test:function(c){return c.qa('p').length>=2}},
  {text:'Pune un cuvânt între `<strong>` și `</strong>` ca să apară îngroșat.',hint:'Exemplu: `<p>Îmi place <strong>muzica</strong>.</p>`',
   test:function(c){return !!c.q('strong')}}
 ]},

/* 1 */
{id:'lectia-1',num:1,nav:'Structura paginii',title:'Structura unei pagini',
 lead:'Orice pagină HTML are același schelet. Îl scriem o dată și îl folosim mereu.',
 intro:
 '<h2>Scheletul oricărei pagini</h2>'+
 '<p>Gândește-te la un plic: pe o parte ai informații despre scrisoare (<code>head</code>), pe cealaltă ai scrisoarea însăși (<code>body</code>). Apasă pe părți și vezi ce rol are fiecare.</p>'+
 '<div class="wg" data-wg="explorer"></div>'+
 '<p>Regula de aur: <mark>tot ce se deschide trebuie și închis</mark>. Dacă ai scris <code>&lt;body&gt;</code>, undeva mai jos trebuie să existe <code>&lt;/body&gt;</code>. Elementele se așază unul în altul ca păpușile matrioșka și nu se încrucișează niciodată.</p>'+
 '<p>În atelier ai scheletul complet. Tot ce scrii între <code>&lt;body&gt;</code> și <code>&lt;/body&gt;</code> apare în pagină. Ce e în <code>&lt;head&gt;</code> nu apare în pagină, dar are efect: uită-te la tab-ul din previzualizare.</p>',
 cmds:[{t:'<!DOCTYPE html>',d:'Spune că este o pagină HTML modernă'},{t:'<html>',d:'Conține toată pagina'},{t:'<head>',d:'Informații despre pagină'},{t:'<meta charset>',d:'Codarea literelor (ă, î, ș, ț)'},{t:'<title>',d:'Numele din tab'},{t:'<body>',d:'Tot ce se vede în pagină'}],
 starter:sk('  '+OC+' Tot ce scrii aici apare în pagină -->\n  <p>Salut! Sunt în interiorul lui body.</p>',{title:'Structura'}),
 controls:[{type:'text',label:'Titlul din tab (title)',re:/(<title>)([^<]*)(<\/title>)/}],
 tasks:[
  {text:'Codul începe cu `<!DOCTYPE html>`.',hint:'Este prima linie din editor. Nu o șterge.',test:function(c){return /^\s*<!DOCTYPE html>/i.test(c.code)}},
  {text:'Ai `html`, `head` și `body`, fiecare cu eticheta de închidere.',hint:'Verifică să existe `</head>`, `</body>` și `</html>`.',test:function(c){return /<html[\s>][\s\S]*<head>[\s\S]*<\/head>[\s\S]*<body[\s>][\s\S]*<\/body>[\s\S]*<\/html>/i.test(c.code)}},
  {text:'Adaugă un titlu `<h1>` în interiorul lui `body`.',hint:'Scrie `<h1>Titlul meu</h1>` între `<body>` și `</body>`.',test:function(c){return !!c.doc.body.querySelector('h1')}},
  {text:'Schimbă `<title>` și observă tab-ul din previzualizare.',hint:'Textul se află între `<title>` și `</title>`, în `head`.',test:function(c){var t=(c.doc.title||'').trim();return t!==''&&t!=='Structura'}}
 ]},

/* 2 */
{id:'lectia-2',num:2,nav:'Titlul și titlurile',title:'Titlul paginii și titlurile',
 lead:'Două lucruri care se numesc la fel și sunt diferite: ce scrie în tab și ce scrie pe pagină.',
 intro:
 '<h2>Două feluri de „titlu”</h2>'+
 '<p>Pagina are un <code>&lt;title&gt;</code> care apare în tab și în rezultatele Google. Apoi are titluri în interior: <code>&lt;h1&gt;</code> până la <code>&lt;h6&gt;</code>. Sunt lucruri diferite.</p>'+
 '<p>Titlurile funcționează ca un cuprins: <code>h1</code> este titlul cărții, <code>h2</code> capitolele, <code>h3</code> subcapitolele. Folosește un singur <code>h1</code> pe pagină și nu sări peste niveluri.</p>'+
 '<p><mark>Alegi nivelul după importanță, nu după cât de mare arată.</mark> Mărimea o schimbăm mai târziu, cu CSS.</p>',
 cmds:[{t:'<title>',d:'Numele paginii, în tab'},{t:'<h1>',d:'Titlul principal, unul singur'},{t:'<h2>',d:'Subtitlu, un capitol'},{t:'<h3> … <h6>',d:'Niveluri tot mai mici'}],
 starter:sk('  <h1>Titlul principal</h1>\n  <h2>Un subtitlu</h2>\n  <h3>Un titlu mai mic</h3>',{title:'Pagina mea'}),
 controls:[{type:'text',label:'Titlul din tab (title)',re:/(<title>)([^<]*)(<\/title>)/},{type:'text',label:'Titlul principal (h1)',re:/(<h1>)([^<]*)(<\/h1>)/}],
 tasks:[
  {text:'Schimbă textul din `<title>`.',hint:'Se află în `head`. Rezultatul îl vezi în tab-ul din previzualizare.',test:function(c){var t=(c.doc.title||'').trim();return t!==''&&t!=='Pagina mea'}},
  {text:'Adaugă un titlu `<h4>`.',hint:'`<h4>Un titlu și mai mic</h4>`',test:function(c){return !!c.q('h4')}},
  {text:'Scrie în `<h1>` un titlu al tău, diferit de „Titlul principal”, păstrând un singur `<h1>`.',hint:'Schimbă textul dintre `<h1>` și `</h1>`. Dacă ai mai multe `h1`, transformă-le în `h2`.',test:function(c){var h=c.qa('h1');return h.length===1&&h[0].textContent.trim()!==''&&h[0].textContent.trim()!=='Titlul principal'}},
  {text:'Adaugă încă un `<h2>`, ca să ai cel puțin două capitole.',hint:'`<h2>Al doilea capitol</h2>`',test:function(c){return c.qa('h2').length>=2}}
 ]},

/* 3 */
{id:'lectia-3',num:3,nav:'Text și paragrafe',title:'Paragrafe și text',
 lead:'Browserul nu citește textul ca tine. Hai să vedem cum îl înțelege.',
 intro:
 '<h2>Text pe înțelesul browserului</h2>'+
 '<p>Browserul <mark>ignoră spațiile în plus și rândurile goale</mark>. Uite primul paragraf din atelier: în cod are multe spații și rânduri, dar pe ecran apare normal. Pentru un paragraf nou folosești <code>&lt;p&gt;</code>, iar pentru o simplă trecere pe rând nou, <code>&lt;br&gt;</code>.</p>'+
 '<p><code>br</code> și <code>hr</code> sunt elemente „singuratice”: n-au conținut, deci nici etichetă de închidere. Textul îngroșat se face cu <code>strong</code>, cel înclinat cu <code>em</code>.</p>'+
 '<p>Poți lăsa note pentru tine în cod, între <code>&lt;!--</code> și <code>--&gt;</code>. Browserul le sare, iar în editor apar gri.</p>',
 cmds:[{t:'<p>',d:'Paragraf'},{t:'<br>',d:'Rând nou, fără paragraf nou'},{t:'<hr>',d:'Linie orizontală'},{t:'<strong>',d:'Îngroșat, important'},{t:'<em>',d:'Înclinat, accentuat'},{t:OC+' … -->',d:'Comentariu, nu se vede'}],
 starter:sk('  <h1>Despre pisici</h1>\n  <p>Acest   text   are   spații   multe,\n     și rânduri noi,\n\n     dar browserul le strânge pe toate.</p>\n  <p>Al doilea paragraf începe pe un rând nou.</p>',{title:'Text'}),
 controls:[],
 tasks:[
  {text:'Ai cel puțin trei paragrafe `<p>`.',hint:'Copiază un paragraf și schimbă textul.',test:function(c){return c.qa('p').length>=3}},
  {text:'Scrie un cuvânt îngroșat cu `<strong>`.',hint:'`<p>Pisicile sunt <strong>curioase</strong>.</p>`',test:function(c){return !!c.q('strong')}},
  {text:'Scrie un cuvânt înclinat cu `<em>`.',hint:'`<em>înclinat</em>`',test:function(c){return !!c.q('em')}},
  {text:'Pune un rând nou cu `<br>` în mijlocul unui paragraf.',hint:'`<p>Primul rând<br>Al doilea rând</p>`',test:function(c){return !!c.q('p br')}},
  {text:'Adaugă o linie orizontală `<hr>`.',hint:'Pune `<hr>` între două paragrafe.',test:function(c){return !!c.q('hr')}},
  {text:'Scrie un comentariu pentru tine.',hint:'Scrie `'+OC+' nota mea -->`. Nu apare în pagină.',test:function(c){return new RegExp('<\\!--[\\s\\S]*?-->').test(c.code)}}
 ]},

/* 4 */
{id:'lectia-4',num:4,nav:'Culoarea de fundal',title:'Culoarea de fundal',
 lead:'Prima comandă de aspect. De aici pagina începe să arate ca a ta.',
 intro:
 '<h2>Atributul style</h2>'+
 '<p>Până acum am scris doar structură. Pentru culori folosim atributul <code>style</code>, adăugat în eticheta de deschidere. Are forma <code>style="proprietate: valoare;"</code>. Pentru fundal, proprietatea este <code>background-color</code>.</p>'+
 '<p>Culoarea o poți scrie în trei feluri, toate corecte. Mută cursoarele și vezi cum se schimbă codurile.</p>'+
 '<div class="wg" data-wg="mixer"></div>'+
 '<p>Numele în engleză sunt ușor de ținut minte (<code>red</code>, <code>lightblue</code>, <code>pink</code>), dar sunt doar vreo 140. Codurile hexazecimale și <code>rgb()</code> pot da orice culoare.</p>'+
 '<p>Atenție la punct și virgulă: fiecare proprietate se încheie cu <code>;</code>.</p>',
 cmds:[{t:'style="…"',d:'Aspectul unui element'},{t:'background-color',d:'Culoarea de fundal'},{t:'#FF6347',d:'Cod hexadecimal'},{t:'rgb(255, 99, 71)',d:'Roșu, verde, albastru'}],
 starter:sk('  <h1>Pagina mea colorată</h1>\n  <p>Fundalul acestei pagini este galben deschis.</p>',{title:'Fundal',battr:' style="background-color: lightyellow;"'}),
 controls:[
  {type:'color',label:'Fundalul paginii',re:/(<body\b[^>]*?background-color:\s*)([^;"]+)()/},
  {type:'swatches',label:'Culori rapide',re:/(<body\b[^>]*?background-color:\s*)([^;"]+)()/,values:['lightyellow','lightblue','lightgreen','pink','lavender','white','#222222']},
  {type:'color',label:'Fundalul titlului (h1)',re:/(<h1\b[^>]*?background-color:\s*)([^;"]+)()/}
 ],
 tasks:[
  {text:'Schimbă fundalul paginii în altă culoare.',hint:'Pe linia `<body style="…">` înlocuiește `lightyellow`.',test:function(c){var b=c.cs(c.doc.body,'backgroundColor');return b!=='rgb(255, 255, 224)'&&b!=='rgba(0, 0, 0, 0)'}},
  {text:'Dă un fundal titlului `h1`.',hint:'Scrie `<h1 style="background-color: orange;">`.',test:function(c){var h=c.q('h1');return !!h&&c.cs(h,'backgroundColor')!=='rgba(0, 0, 0, 0)'}},
  {text:'Folosește un cod hexadecimal (care începe cu `#`) undeva în cod.',hint:'Exemplu: `background-color: #FFB6C1;`',test:function(c){return /#[0-9a-f]{3,6}\b/i.test(c.code)}}
 ]},

/* 5 */
{id:'lectia-5',num:5,nav:'Stilul textului',title:'Culoarea și stilul textului',
 lead:'Același atribut style, alte proprietăți: culoare, mărime, font și aliniere.',
 intro:
 '<h2>Mai multe proprietăți, un singur style</h2>'+
 '<p>Poți pune mai multe proprietăți în același atribut, separate prin <code>;</code>. <code>color</code> schimbă culoarea literelor, nu a fundalului. <code>font-size</code> schimbă mărimea, în <code>px</code> (pixeli). <code>font-family</code> alege fontul, cu variante de rezervă pentru cazul în care calculatorul nu îl are. <code>text-align</code> aliniază textul.</p>'+
 '<p><mark>Contrastul contează.</mark> Literele trebuie să se vadă pe fundal. Un text galben pe fundal alb arată bine în cod și se citește greu pe ecran.</p>',
 cmds:[{t:'color',d:'Culoarea literelor'},{t:'font-size',d:'Mărimea, de ex. 24px'},{t:'font-family',d:'Fontul (Arial, Georgia…)'},{t:'text-align',d:'left, center sau right'}],
 starter:sk('  <h1 style="color: royalblue; text-align: left;">Titlu colorat</h1>\n  <p style="font-size: 18px; font-family: Georgia, serif; color: #333333;">Acesta este un paragraf cu stil propriu. Schimbă mărimea, fontul și culoarea.</p>',{title:'Text stilat'}),
 controls:[
  {type:'color',label:'Culoarea titlului',re:/(<h1\b[^>]*?(?<![-\w])color:\s*)([^;"]+)()/},
  {type:'select',label:'Alinierea titlului',options:[['left','la stânga'],['center','centrat'],['right','la dreapta']],re:/(<h1\b[^>]*?text-align:\s*)([^;"]+)()/},
  {type:'range',label:'Mărimea paragrafului (px)',min:10,max:60,re:/(<p\b[^>]*?font-size:\s*)(\d+)(px)/},
  {type:'select',label:'Fontul paragrafului',options:[['Georgia, serif','Georgia'],['Arial, sans-serif','Arial'],["'Courier New', monospace",'Courier New'],['Verdana, sans-serif','Verdana'],["'Times New Roman', serif",'Times New Roman']],re:/(<p\b[^>]*?font-family:\s*)([^;"]+)()/},
  {type:'color',label:'Culoarea paragrafului',re:/(<p\b[^>]*?(?<![-\w])color:\s*)([^;"]+)()/}
 ],
 tasks:[
  {text:'Centrează titlul cu `text-align: center`.',hint:'În `<h1 style="…">` înlocuiește `left` cu `center`.',test:function(c){var h=c.q('h1');return !!h&&c.cs(h,'textAlign')==='center'}},
  {text:'Fă paragraful mai mare de 22 de pixeli.',hint:'Schimbă `18px` în `24px` sau mai mult.',test:function(c){var p=c.q('p');return !!p&&parseFloat(c.cs(p,'fontSize'))>22}},
  {text:'Schimbă culoarea titlului în alta decât `royalblue`.',hint:'Încearcă `crimson`, `seagreen` sau `#ff8800`.',test:function(c){var h=c.q('h1');return !!h&&c.cs(h,'color')!=='rgb(65, 105, 225)'}},
  {text:'Schimbă culoarea paragrafului.',hint:'Înlocuiește `#333333` cu altă culoare.',test:function(c){var p=c.q('p');return !!p&&c.cs(p,'color')!=='rgb(51, 51, 51)'}}
 ]},

/* 6 */
{id:'lectia-6',num:6,nav:'Liste',title:'Liste',
 lead:'Liste cu buline, liste numerotate și liste în liste.',
 intro:
 '<h2>Buline sau numere?</h2>'+
 '<p>Sunt două feluri: <code>&lt;ul&gt;</code> (<em>unordered list</em>) pentru buline, când ordinea nu contează, și <code>&lt;ol&gt;</code> (<em>ordered list</em>) pentru pași numerotați. Fiecare punct este un <code>&lt;li&gt;</code> (<em>list item</em>).</p>'+
 '<p>Listele se pot pune una în alta: un <code>ul</code> poate sta chiar în interiorul unui <code>li</code>. Indentarea din cod te ajută să vezi ce e în ce.</p>'+
 '<p>La <code>ol</code>, atributul <code>type</code> schimbă numerotarea: <code>1</code>, <code>A</code>, <code>a</code>, <code>I</code>, <code>i</code>.</p>',
 cmds:[{t:'<ul>',d:'Listă cu buline'},{t:'<ol>',d:'Listă numerotată'},{t:'<li>',d:'Un punct din listă'},{t:'type="A"',d:'Numerotare cu litere'}],
 starter:sk('  <h1>Lista de cumpărături</h1>\n  <ul>\n    <li>Pâine</li>\n    <li>Lapte</li>\n    <li>Mere</li>\n  </ul>\n  <h2>Pașii rețetei</h2>\n  <ol type="1">\n    <li>Amestecă ouăle</li>\n    <li>Adaugă făina</li>\n    <li>Coace 30 de minute</li>\n  </ol>',{title:'Liste'}),
 controls:[{type:'select',label:'Numerotarea listei ol',options:[['1','1, 2, 3'],['A','A, B, C'],['a','a, b, c'],['I','I, II, III'],['i','i, ii, iii']],re:/(<ol\b[^>]*?type=")([^"]*)(")/}],
 tasks:[
  {text:'Lista cu buline are cel puțin cinci puncte.',hint:'Adaugă `<li>…</li>` între `<ul>` și `</ul>`.',test:function(c){return c.qa('ul > li').length>=5}},
  {text:'Schimbă numerotarea listei `ol` în litere sau cifre romane.',hint:'La `<ol type="1">` pune `A` sau `I`.',test:function(c){var o=c.q('ol');return !!o&&(o.getAttribute('type')||'1')!=='1'}},
  {text:'Pune o listă în interiorul unui `li`.',hint:'`<li>Fructe<ul><li>Mere</li></ul></li>`',test:function(c){return !!c.q('li ul, li ol')}}
 ]},

/* 7 */
{id:'lectia-7',num:7,nav:'Linkuri',title:'Linkuri',
 lead:'Linkurile sunt ceea ce face din pagini o rețea.',
 intro:
 '<h2>Elementul a, de la „anchor”</h2>'+
 '<p>Elementul <code>&lt;a&gt;</code> face un link. Adresa merge în atributul <code>href</code>, iar textul pe care se dă click stă între etichete: <code>&lt;a href="adresa"&gt;text&lt;/a&gt;</code>.</p>'+
 '<p>Un link poate duce la alt site, la altă pagină a ta sau la un loc din aceeași pagină (<code>href="#jos"</code> duce la elementul cu <code>id="jos"</code>). Cu <code>target="_blank"</code> se deschide într-un tab nou.</p>'+
 '<p>În previzualizare, linkurile către alte site-uri sunt blocate din motive de securitate. În browserul tău, după ce salvezi fișierul, merg normal. Linkul către <code>#jos</code> funcționează și aici.</p>',
 cmds:[{t:'<a href="…">',d:'Link către o adresă'},{t:'target="_blank"',d:'Se deschide în tab nou'},{t:'#jos',d:'Salt în aceeași pagină'},{t:'id="jos"',d:'Numele unui loc din pagină'}],
 starter:sk('  <h1>Linkuri utile</h1>\n  <p>Citește despre HTML pe <a href="https://ro.wikipedia.org">Wikipedia</a>.</p>\n  <p>Alt link: <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a></p>\n  <p><a href="#jos">Sari la sfârșitul paginii</a></p>\n  <div style="height: 300px;"></div>\n  <p id="jos">Ai ajuns jos! Aici este ținta linkului.</p>',{title:'Linkuri'}),
 controls:[
  {type:'text',label:'Textul primului link',re:/(<a\b[^>]*>)([^<]*)(<\/a>)/},
  {type:'text',label:'Adresa primului link',re:/(<a\b[^>]*?href=")([^"]*)(")/}
 ],
 tasks:[
  {text:'Pagina are cel puțin patru linkuri `<a href="…">`.',hint:'Copiază un paragraf cu link și schimbă adresa.',test:function(c){return c.qa('a[href]').length>=4}},
  {text:'Un link se deschide în tab nou cu `target="_blank"`.',hint:'Adaugă `target="_blank"` în eticheta `<a …>`.',test:function(c){return c.qa('a[target="_blank"]').length>=2}},
  {text:'Dă unui link altă culoare cu `style="color: …"`.',hint:'`<a href="#jos" style="color: crimson;">`',test:function(c){return c.qa('a').some(function(a){var k=c.cs(a,'color');return k!=='rgb(0, 0, 238)'&&k!=='rgb(85, 26, 139)'})}}
 ]},

/* 8 */
{id:'lectia-8',num:8,nav:'Imagini',title:'Imagini',
 lead:'O poză spune cât o mie de cuvinte, dar browserul trebuie să știe ce este.',
 intro:
 '<h2>Elementul img</h2>'+
 '<p><code>&lt;img&gt;</code> nu are etichetă de închidere. Are nevoie de două atribute: <code>src</code> (fișierul cu poza) și <code>alt</code> (descrierea ei în cuvinte, citită de cititoarele de ecran și afișată dacă poza nu se încarcă). Cu <code>width</code> setezi lățimea, în pixeli.</p>'+
 '<p>În realitate, poza trebuie să stea în același folder cu <code>pagina.html</code>. Aici ai patru poze gata făcute, în „folderul” de sub editor. Apasă pe una ca s-o adaugi în pagină.</p>',
 cmds:[{t:'<img>',d:'O imagine'},{t:'src="poza.svg"',d:'Fișierul cu poza'},{t:'alt="…"',d:'Descrierea imaginii'},{t:'width="150"',d:'Lățimea în pixeli'}],
 files:true,
 starter:sk('  <h1>Galeria mea</h1>\n  <img src="soare.svg" alt="Un soare galben" width="150">\n  <img src="casa.svg" alt="O căsuță roșie" width="150">',{title:'Galerie'}),
 controls:[
  {type:'select',label:'Poza primei imagini',options:[['soare.svg','soare.svg'],['luna.svg','luna.svg'],['casa.svg','casa.svg'],['copac.svg','copac.svg']],re:/(<img\b[^>]*?src=")([^"]*)(")/},
  {type:'range',label:'Lățimea primei imagini (px)',min:50,max:400,step:10,re:/(<img\b[^>]*?width=")(\d+)(")/},
  {type:'text',label:'Descrierea primei imagini (alt)',re:/(<img\b[^>]*?alt=")([^"]*)(")/}
 ],
 tasks:[
  {text:'Pagina are cel puțin trei imagini.',hint:'Apasă pe o poză din folder ca s-o adaugi.',test:function(c){return c.qa('img').length>=3}},
  {text:'Schimbă `alt`-ul primei imagini cu o descriere scrisă de tine.',hint:'Scrie în `alt="…"` ce se vede în poză, cu cuvintele tale.',test:function(c){var i=c.q('img');var a=i?(i.getAttribute('alt')||'').trim():'';return a!==''&&a!=='Un soare galben'}},
  {text:'O imagine este mai lată de 200 de pixeli.',hint:'Schimbă `width="150"` în `250`.',test:function(c){return c.qa('img').some(function(i){return parseFloat(c.cs(i,'width'))>=200})}}
 ]},

/* 9 */
{id:'lectia-9',num:9,nav:'Formulare',title:'Butoane și formulare',
 lead:'Până acum pagina doar arăta ceva. Acum primește și răspunsuri.',
 intro:
 '<h2>Câmpuri, etichete, butoane</h2>'+
 '<p><code>&lt;input&gt;</code> este o căsuță în care scrie utilizatorul. Atributul <code>type</code> decide ce fel de câmp este: text, email, parolă, număr, dată, căsuță bifabilă. <code>placeholder</code> pune un text-exemplu gri.</p>'+
 '<p><code>&lt;label&gt;</code> este eticheta câmpului. Legătura se face cu <code>for</code>, care trebuie să fie identic cu <code>id</code>-ul câmpului. Apoi un click pe etichetă activează câmpul. <code>&lt;button&gt;</code> este butonul.</p>'+
 '<p>Încearcă în previzualizare să scrii în câmp. Trimiterea datelor nu merge aici, pentru că are nevoie de un server, dar formularul se simte ca pe un site real.</p>',
 cmds:[{t:'<input>',d:'Un câmp de completat'},{t:'type="email"',d:'Felul câmpului'},{t:'placeholder="…"',d:'Text-exemplu în câmp'},{t:'<label for="…">',d:'Eticheta câmpului'},{t:'<button>',d:'Un buton'}],
 starter:sk('  <h1>Înscriere la club</h1>\n  <label for="nume">Numele tău:</label><br>\n  <input type="text" id="nume" placeholder="Ex: Maria"><br><br>\n  <button>Trimite</button>',{title:'Înscriere'}),
 controls:[
  {type:'select',label:'Felul primului câmp',options:[['text','text'],['email','email'],['password','parolă'],['number','număr'],['date','dată'],['color','culoare'],['checkbox','căsuță bifabilă']],re:/(<input\b[^>]*?type=")([^"]*)(")/},
  {type:'text',label:'Textul-exemplu (placeholder)',re:/(placeholder=")([^"]*)(")/},
  {type:'text',label:'Textul butonului',re:/(<button\b[^>]*>)([^<]*)(<\/button>)/}
 ],
 tasks:[
  {text:'Ai cel puțin două câmpuri `<input>`.',hint:'Adaugă un al doilea `<input type="email">`.',test:function(c){return c.qa('input').length>=2}},
  {text:'Ai cel puțin două etichete `label` legate de câmpuri prin `for` și `id`.',hint:'`<label for="mail">…</label>` și `<input id="mail">`.',test:function(c){return c.qa('label[for]').filter(function(l){return !!c.doc.getElementById(l.getAttribute('for'))}).length>=2}},
  {text:'Adaugă o căsuță bifabilă: `type="checkbox"`.',hint:'`<input type="checkbox" id="acord"> <label for="acord">Sunt de acord</label>`',test:function(c){return !!c.q('input[type="checkbox"]')}},
  {text:'Schimbă textul butonului.',hint:'Între `<button>` și `</button>` scrie altceva decât „Trimite”.',test:function(c){var b=c.q('button');return !!b&&b.textContent.trim()!==''&&b.textContent.trim()!=='Trimite'}}
 ]},

/* 10 */
{id:'lectia-10',num:10,nav:'Containere și clase',title:'Containere și clase',
 lead:'Cum scrii stilul o singură dată și îl aplici la zece elemente.',
 intro:
 '<h2>div, span și class</h2>'+
 '<p><code>&lt;div&gt;</code> este o cutie invizibilă care grupează elemente. <code>&lt;span&gt;</code> este o cutie mică, în interiorul unui rând, pentru a marca doar câteva cuvinte.</p>'+
 '<p>Să scriem <code>style</code> la fiecare element devine obositor. Soluția: dăm elementelor un nume de grup, o <mark>clasă</mark> (<code>class="card"</code>), iar stilul îl scriem o singură dată într-un bloc <code>&lt;style&gt;</code> din <code>head</code>: <code>.card { … }</code>. Punctul din fața numelui înseamnă „toate elementele cu această clasă”.</p>'+
 '<p>Schimbă o valoare în <code>.card</code> și vezi cum se schimbă toate cardurile deodată. Asta este puterea CSS.</p>',
 cmds:[{t:'<div>',d:'Cutie care grupează'},{t:'<span>',d:'Cutie mică, în rând'},{t:'class="card"',d:'Numele unui grup de elemente'},{t:'<style>',d:'Aici scrii stilul, în head'},{t:'border-radius',d:'Colțuri rotunjite'},{t:'padding',d:'Spațiu în interiorul cutiei'}],
 starter:sk('  <div class="card">\n    <h2>Prima carte</h2>\n    <p>Un <span class="alert">cuvânt roșu</span> într-un paragraf.</p>\n  </div>\n  <div class="card">\n    <h2>A doua carte</h2>\n    <p>Aceeași clasă, același aspect.</p>\n  </div>',{title:'Carduri',head:'\n  <style>\n    body { font-family: Arial, sans-serif; background-color: #EEF3FB; }\n    .card {\n      background-color: white;\n      border: 2px solid steelblue;\n      border-radius: 12px;\n      padding: 16px;\n      margin: 12px;\n    }\n    .alert { color: crimson; font-weight: bold; }\n  </style>'}),
 controls:[
  {type:'range',label:'Rotunjirea colțurilor (px)',min:0,max:60,re:/(\.card\s*\{[^}]*?border-radius:\s*)(\d+)(px)/},
  {type:'range',label:'Spațiul din interior (px)',min:0,max:60,re:/(\.card\s*\{[^}]*?padding:\s*)(\d+)(px)/},
  {type:'color',label:'Fundalul cardurilor',re:/(\.card\s*\{[^}]*?background-color:\s*)([^;]+)(;)/}
 ],
 tasks:[
  {text:'Ai trei elemente cu clasa `card`.',hint:'Copiază un `<div class="card">…</div>` întreg.',test:function(c){return c.qa('.card').length>=3}},
  {text:'Rotunjește colțurile cardurilor la 24 de pixeli sau mai mult.',hint:'În `.card`, schimbă `border-radius: 12px`.',test:function(c){var d=c.q('.card');return !!d&&parseFloat(c.cs(d,'borderTopLeftRadius'))>=24}},
  {text:'Scrie o a treia clasă nouă în blocul `<style>`.',hint:'`.mare { font-size: 28px; }`, apoi `<p class="mare">`.',test:function(c){return (c.code.match(/\.[a-zA-Z][\w-]*\s*\{/g)||[]).length>=3}}
 ]},

/* ---------- COLORARE COD ---------- */
function hlCss(t){
  return t.replace(/\/\*[\s\S]*?\*\/|[^{}]+(?=\{)|([a-z-]+)(\s*:)([^;{}]*)(;?)|[{}]/gi,function(m,p,c,v,s){
    if(m.slice(0,2)==='/*')return '<i class="c">'+esc(m)+'</i>';
    if(p!==undefined)return '<i class="p">'+esc(p)+'</i>'+esc(c)+'<i class="s">'+esc(v)+'</i>'+esc(s);
    if(m==='{'||m==='}')return esc(m);
    return '<i class="sel">'+esc(m)+'</i>';
  });
}
function hlAttrs(a){
  return a.replace(/(\s+)|([^\s=]+)(\s*=\s*)("[^"]*"?|'[^']*'?|[^\s>]*)|([^\s=]+)|([\s\S])/g,function(m,ws,n,eq,v,lone){
    if(ws)return ws;
    if(n!==undefined)return '<i class="a">'+esc(n)+'</i>'+esc(eq)+'<i class="s">'+esc(v)+'</i>';
    if(lone)return '<i class="a">'+esc(lone)+'</i>';
    return esc(m);
  });
}
var TAGRE=new RegExp('<\\!--[\\s\\S]*?(?:-->|$)|<\\!DOCTYPE[^>]*>?|<\\/?[a-zA-Z][^>]*>?','gi');
var PARTRE=/^<(\/?)([a-zA-Z][\w-]*)([\s\S]*?)(\/?>?)$/;
function highlight(src){
  var out='',last=0,inStyle=false,m;
  TAGRE.lastIndex=0;
  while((m=TAGRE.exec(src))){
    var pre=src.slice(last,m.index);
    out+=inStyle?hlCss(pre):esc(pre);
    last=m.index+m[0].length;
    var t=m[0];
    if(t.slice(0,4)===OC){out+='<i class="c">'+esc(t)+'</i>';}
    else if(/^<!doctype/i.test(t)){out+='<i class="d">'+esc(t)+'</i>';}
    else{
      var mm=PARTRE.exec(t);
      if(!mm){out+=esc(t);continue}
      out+='<i class="t">&lt;'+mm[1]+esc(mm[2])+'</i>'+hlAttrs(mm[3])+'<i class="t">'+esc(mm[4])+'</i>';
      if(mm[2].toLowerCase()==='style')inStyle=!mm[1];
    }
    if(m[0].length===0)TAGRE.lastIndex++;
  }
  var rest=src.slice(last);
  out+=inStyle?hlCss(rest):esc(rest);
  return out;
}

/* ---------- utilitare ---------- */
function toHex(c){
  try{var x=document.createElement('canvas').getContext('2d');x.fillStyle='#000000';x.fillStyle=c;var v=x.fillStyle;
    if(v.charAt(0)==='#')return v;
    var m=v.match(/\d+/g);if(m)return '#'+m.slice(0,3).map(function(n){return ('0'+(+n).toString(16)).slice(-2)}).join('');
  }catch(e){}
  return '#000000';
}
function csOf(el,p){if(!el)return '';var w=(el.ownerDocument&&el.ownerDocument.defaultView)||window;try{return w.getComputedStyle(el)[p]}catch(e){return ''}}

var cur=null,mountTimer=null,mountPrev=null,labApi=null;

function mountLab(L){
  var ta=$('#code'),pre=$('#hl'),gut=$('#gut'),frame=$('#frame'),tab=$('#tab');
  var ctls=[],taskEls=$$('.tk'),noTab=false,prevOk=L.tasks.map(function(){return false});
  ta.value=(S.code[L.id]!==undefined)?S.code[L.id]:L.starter;

  var api={
    get:function(){return ta.value},
    set:function(v){var st=ta.scrollTop,sl=ta.scrollLeft;ta.value=v;sync(true);ta.scrollTop=st;ta.scrollLeft=sl}
  };

  api.addBody=function(snip){
    var ind=snip.split('\n').map(function(l){return '  '+l}).join('\n')+'\n';
    var code=ta.value,i=code.search(/<\/body>/i);
    api.set(i>-1?code.slice(0,i)+ind+code.slice(i):code+'\n'+snip+'\n');
  };
  labApi=api;
  function getDoc(){
    try{var d=frame.contentDocument;if(d&&d.body)return d}catch(e){}
    return new DOMParser().parseFromString(withImages(ta.value),'text/html');
  }
  function runTasks(){
    if(!L.tasks.length)return;
    var doc=getDoc(),code=ta.value;
    var ctx={doc:doc,code:code,cs:csOf,q:function(s){return doc.querySelector(s)},qa:function(s){return Array.prototype.slice.call(doc.querySelectorAll(s))}};
    var n=0;
    L.tasks.forEach(function(t,i){
      var ok=false;try{ok=!!t.test(ctx)}catch(e){ok=false}
      var li=taskEls[i];if(!li)return;
      li.classList.toggle('ok',ok);
      var sr=$('.sr',li);if(sr)sr.textContent=ok?'terminat: ':'de făcut: ';
      if(ok)n++;
    });
    $('#tcnt').textContent=n+' / '+L.tasks.length;
    var all=n===L.tasks.length;
    $('#win').hidden=!all;
    if(all&&!S.done[L.id]){S.done[L.id]=true;save();markNav()}
  }
  function updTab(){
    var t='';try{t=(frame.contentDocument.title||'').trim()}catch(e){var m=ta.value.match(/<title>([^<]*)<\/title>/i);t=m?m[1].trim():''}
    tab.textContent=t||'pagina.html';
  }
  frame.addEventListener('load',function(){updTab();runTasks()});
  function renderPreview(){frame.srcdoc=withImages(ta.value)}

  function syncCtls(){ctls.forEach(function(c){c.sync(ta.value)})}
  function sync(immediate){
    var v=ta.value;
    pre.innerHTML=highlight(v)+'\n';
    var n=v.split('\n').length,g='';for(var i=1;i<=n;i++)g+=i+'\n';gut.textContent=g;
    S.code[L.id]=v;save();
    syncCtls();
    clearTimeout(mountTimer);
    if(immediate===true)renderPreview();else mountTimer=setTimeout(renderPreview,180);
  }
  ta.addEventListener('input',function(){sync()});
  ta.addEventListener('scroll',function(){pre.scrollTop=ta.scrollTop;pre.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop});
  ta.addEventListener('blur',function(){noTab=false});
  function ins(text){
    ta.focus();
    var ok=false;try{ok=document.execCommand('insertText',false,text)}catch(e){}
    if(!ok){ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,'end');sync()}
  }
  ta.addEventListener('keydown',function(e){
    if(e.key==='Escape'){noTab=true;return}
    if(e.key==='Tab'&&!noTab&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      e.preventDefault();
      if(e.shiftKey){
        var s=ta.selectionStart,ls=ta.value.lastIndexOf('\n',s-1)+1;
        if(ta.value.slice(ls,ls+2)==='  '){ta.setSelectionRange(ls,ls+2);ins('');}
      }else ins('  ');
      return;
    }
    if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
      var p=ta.selectionStart,ls2=ta.value.lastIndexOf('\n',p-1)+1;
      var ind=(ta.value.slice(ls2,p).match(/^[ \t]*/)||[''])[0];
      e.preventDefault();ins('\n'+ind);
    }
  });

  /* controale */
  function buildCtl(c,i){
    var w=document.createElement('div');w.className='ctl';
    var id='ct'+i,h='<label for="'+id+'">'+esc(c.label)+'</label>';
    if(c.type==='color')h+='<div class="row"><input type="color" id="'+id+'"><code class="val"></code></div>';
    else if(c.type==='range')h+='<div class="row"><input type="range" id="'+id+'" min="'+c.min+'" max="'+c.max+'" step="'+(c.step||1)+'"><code class="val"></code></div>';
    else if(c.type==='select')h+='<select id="'+id+'">'+c.options.map(function(o){return '<option value="'+qa(o[0])+'">'+esc(o[1])+'</option>'}).join('')+'</select>';
    else if(c.type==='text')h+='<input type="text" id="'+id+'" autocomplete="off" spellcheck="false">';
    else if(c.type==='swatches')h+='<div class="sw" id="'+id+'">'+c.values.map(function(v){return '<button type="button" class="swb" data-v="'+qa(v)+'" style="background:'+qa(v)+'" title="'+qa(v)+'" aria-label="'+qa(v)+'"></button>'}).join('')+'</div>';
    w.innerHTML=h;
    var inp=$('#'+id,w),val=$('.val',w);
    function apply(v){
      var code=ta.value;if(!c.re.test(code))return;
      api.set(code.replace(c.re,function(m,a,b,d){return a+v+d}));
    }
    if(c.type==='swatches'){w.addEventListener('click',function(e){var b=e.target.closest('.swb');if(b)apply(b.dataset.v)})}
    else inp.addEventListener('input',function(){
      var v=inp.value;
      if(c.type==='text')v=v.replace(/[<>]/g,'');
      apply(v);
      if(val&&c.type==='range')val.textContent=v+(c.unit===undefined?' px':c.unit);
    });
    c.sync=function(code){
      var m=c.re.exec(code);
      w.classList.toggle('off',!m);
      if(inp&&inp.tagName)inp.disabled=!m;
      $$('.swb',w).forEach(function(b){b.disabled=!m});
      w.title=m?'':'Elementul nu există (încă) în cod';
      if(!m)return;
      var v=m[2].trim();
      if(c.type==='swatches'){$$('.swb',w).forEach(function(b){b.style.outline=toHex(b.dataset.v)===toHex(v)?'2px solid var(--accent)':'none'});return}
      if(document.activeElement===inp&&c.type==='text')return;
      if(c.type==='color'){inp.value=toHex(v);val.textContent=inp.value.toUpperCase()}
      else if(c.type==='range'){inp.value=parseFloat(v);val.textContent=parseFloat(v)+(c.unit===undefined?' px':c.unit)}
      else if(c.type==='select'){
        var has=Array.prototype.some.call(inp.options,function(o){return o.value===v});
        if(!has){var o=document.createElement('option');o.value=v;o.textContent=v;inp.appendChild(o)}
        inp.value=v;
      }else inp.value=v;
    };
    ctls.push(c);
    return w;
  }
  var grid=$('#cgrid');
  if(grid)L.controls.forEach(function(c,i){grid.appendChild(buildCtl(c,i))});

  /* fișiere (imagini) */
  var files=$('#files');
  if(files){
    $('.row',files).innerHTML=Object.keys(IMGS).map(function(k){return '<button type="button" data-f="'+k+'" title="Adaugă în pagină"><img src="'+IMGS[k]+'" alt="">'+k+'</button>'}).join('');
    files.addEventListener('click',function(e){
      var b=e.target.closest('button[data-f]');if(!b)return;
      var tag='  <img src="'+b.dataset.f+'" alt="'+IMG_ALT[b.dataset.f]+'" width="150">\n';
      var code=ta.value;
      var i=code.search(/<\/body>/i);
      api.set(i>-1?code.slice(0,i)+tag+code.slice(i):code+'\n'+tag);
    });
  }

  /* butoane unelte */
  $('#bCopy').addEventListener('click',function(){
    var b=this;
    function done(){var t=b.textContent;b.textContent='Cod copiat';setTimeout(function(){b.textContent=t},1500)}
    function fallback(){ta.focus();ta.select();try{document.execCommand('copy');done()}catch(e){}}
    try{navigator.clipboard.writeText(ta.value).then(done,fallback)}catch(e){fallback()}
  });
  var rb=$('#bReset'),rt=null;
  rb.addEventListener('click',function(){
    if(!rb.dataset.arm){rb.dataset.arm='1';rb.textContent='Sigur? Apasă din nou';rt=setTimeout(function(){delete rb.dataset.arm;rb.textContent='Resetează lecția'},3000);return}
    clearTimeout(rt);delete rb.dataset.arm;rb.textContent='Resetează lecția';api.set(L.starter);
  });

  sync(true);
}

  }
  if(props.length){
    h+='<details class="props-d" open><summary>Proprietățile și atributele, pe larg <small>'+props.length+' carduri · „Încearcă în atelier” pune exemplul în editor</small></summary><div class="props">'+props.map(function(p,i){return propCard(p,i,L,false)}).join('')+'</div></details>';
  }
  if(L.mist&&L.mist.length)h+=mistBox(L.mist);
  h+='<section class="lab" id="lab" aria-label="Atelier"><div class="lab-bar"><h2 class="sec-t" style="margin:0">Atelierul tău <small>scrie în stânga, vezi în dreapta</small></h2><div class="tools"><button class="btn" id="bCopy" type="button">Copiază codul</button><button class="btn" id="bReset" type="button">Resetează lecția</button></div></div>';
  h+='<div class="split"><div class="pane"><div class="ph"><span class="ft">pagina.html</span><span class="hint-e">Esc, apoi Tab: ieși din editor</span></div><div class="edbox"><div class="gut" id="gut" aria-hidden="true"></div><div class="edin"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Editor de cod HTML"></textarea></div></div></div>';
  h+='<div class="pane pv"><div class="chrome"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><div class="tab" id="tab">pagina.html</div></div><div class="addr">pagina.html</div><iframe id="frame" title="Previzualizarea paginii" sandbox="allow-same-origin"></iframe></div></div>';
  if(L.files)h+='<div class="files" id="files"><h3 class="sec-t" style="margin:0;font-size:1rem">Folderul tău <small>apasă pe o poză ca s-o adaugi în pagină</small></h3><div class="row"></div></div>';
  if(hasCtl||hasTasks){
    h+='<div class="under'+(hasCtl&&hasTasks?'':' one')+'">';
    if(hasCtl)h+='<div class="box-p"><h3>Schimbă din butoane</h3><p class="note">Mută un cursor sau alege o valoare și vezi cum se rescrie codul din editor.</p><div class="cgrid" id="cgrid"></div></div>';
    if(hasTasks){
      h+='<div class="box-p"><div class="th"><h3>Provocări</h3><span class="cnt" id="tcnt">0 / '+L.tasks.length+'</span></div><ul class="tasks-l">'+L.tasks.map(function(t){return '<li class="tk"><span class="box" aria-hidden="true"></span><div><p class="tx"><span class="sr">de făcut: </span>'+fmt(t.text)+'</p><details class="hint"><summary>Indiciu</summary><p>'+fmt(t.hint)+'</p></details></div></li>'}).join('')+'</ul>';
      h+='<div class="win" id="win" hidden><p>Lecție terminată. Toate provocările sunt bifate.</p>'+(next?'<button class="btn pri" type="button" data-go="'+next.id+'">Lecția următoare →</button>':'')+'</div></div>';
    }
    h+='</div>';
  }
  h+='</section>';
  h+='<div class="pager">'+(prev?'<button class="btn" type="button" data-go="'+prev.id+'">← '+esc(prev.nav)+'</button>':'<span></span>')+(next?'<button class="btn pri" type="button" data-go="'+next.id+'">'+esc(next.nav)+' →</button>':'')+'</div>';
  $('#lesson').innerHTML=h;
  $$('[data-wg]',$('#lesson')).forEach(function(w){var f=W[w.dataset.wg];if(f)f(w)});
  mountLab(L);
  markNav();
}
document.addEventListener('click',function(e){
  var j=e.target.closest('[data-jump]');
  if(j){var t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  var b=e.target.closest('[data-try]');if(!b)return;
  var a=b.dataset.try.split('|'),L=LESSONS.filter(function(l){return l.id===a[0]})[0];
  if(!L||!labApi||cur!==L.id)return;
  var p=(L.props||[])[+a[1]];if(!p||!p.ex)return;
  labApi.addBody(p.ex);
  var lab=document.getElementById('lab');if(lab)lab.scrollIntoView({behavior:'smooth',block:'start'});
  var o=b.textContent;b.textContent='Adăugat în editor';setTimeout(function(){b.textContent=o},1600);
});

/* ---------- NAVIGARE ---------- */
function buildNav(){
  $('#nav').innerHTML=LESSONS.map(function(l){return '<li><button type="button" class="nl'+(l.free?' free':'')+'" data-id="'+l.id+'"><span class="n">'+l.num+'</span><span class="tt">'+esc(l.nav)+'</span><span class="ck" aria-hidden="true"></span></button></li>'}).join('');
}
function markNav(){
  $$('.nl').forEach(function(b){
    var on=b.dataset.id===cur;
    b.classList.toggle('on',on);b.classList.toggle('dn',!!S.done[b.dataset.id]);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  var total=LESSONS.filter(function(l){return !l.free}).length;
  var d=LESSONS.filter(function(l){return !l.free&&S.done[l.id]}).length;
  $('#progtxt').textContent=d+' din '+total+' lecții terminate';
  $('#progbar').style.width=(d/total*100)+'%';
}
function go(id){
  if(location.hash.slice(1)===id){show(id);window.scrollTo(0,0);return}
  location.hash=id;
}
function route(){
  var id=location.hash.slice(1);
  if(!LESSONS.some(function(l){return l.id===id}))id=LESSONS[0].id;
  show(id);window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-id],[data-go]');
  if(b&&(b.classList.contains('nl')||b.dataset.go)){go(b.dataset.go||b.dataset.id)}
});
window.addEventListener('hashchange',route);
window.addEventListener('keydown',function(e){
  if(!e.altKey||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;
  var i=LESSONS.map(function(l){return l.id}).indexOf(cur),n=LESSONS[i+(e.key==='ArrowRight'?1:-1)];
  if(n){e.preventDefault();go(n.id)}
});

/* ---------- UNELTE GLOBALE ---------- */
function applyFont(){document.documentElement.style.setProperty('--code-size',(S.font+(S.present?3:0))+'px')}
$('#tFont').addEventListener('click',function(){S.font=Math.max(11,S.font-1);applyFont();save()});
$('#tFontUp').addEventListener('click',function(){S.font=Math.min(24,S.font+1);applyFont();save()});
$('#tPresent').addEventListener('click',function(){
  S.present=!S.present;document.documentElement.classList.toggle('present',S.present);
  this.setAttribute('aria-pressed',S.present);applyFont();save();
});
$('#tTheme').addEventListener('click',function(){
  var r=document.documentElement,cs=r.dataset.theme;
  var dark=cs?cs==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme=dark?'light':'dark';r.dataset.theme=S.theme;save();
});
if(S.theme)document.documentElement.dataset.theme=S.theme;
if(S.present){document.documentElement.classList.add('present');$('#tPresent').setAttribute('aria-pressed','true')}
applyFont();

buildNav();
route();
})();
</script>

</body></html>
