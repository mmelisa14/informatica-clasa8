<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier HTML – Recapitulare lecția 2</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap"><style>
:root{--bg:#f3f6ff;--card:#fff;--fg:#1b2a4a;--mut:#5b6b8c;--line:#d6e0f5;--pri:#4f46e5;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--code:#17213a;--cf:#e7ecf7;--c1:#4f46e5;--c2:#ec4899;--c3:#f59e0b;--c4:#10b981;--c5:#0ea5e9;box-sizing:border-box}*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--fg);font:500 1.08rem/1.6 Nunito,system-ui,sans-serif}button{cursor:pointer;font:800 1rem 'Baloo 2',sans-serif;border:0;border-radius:13px;padding:10px 16px;min-height:44px;background:var(--pri);color:white}button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.top{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px}.top b,.top span{font:800 1rem 'Baloo 2';white-space:nowrap}.bar{flex:1;background:var(--line);height:11px;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#ec4899);transition:width .3s}.hero{text-align:center;background:linear-gradient(135deg,#0ea5e9,#4f46e5,#ec4899);color:white;padding:44px 16px}.hero .emoji{font-size:3.4rem}.hero h1{font:800 clamp(2.2rem,7vw,3.5rem)/1.1 'Baloo 2';margin:8px}.hero p{max-width:600px;margin:10px auto 20px}.hero button{background:white;color:#4338ca}main{max-width:850px;margin:auto;padding:22px 14px 60px}section{background:var(--card);border-radius:23px;padding:20px;margin-bottom:22px;border-top:8px solid var(--ac);box-shadow:0 6px 0 var(--line)}h2{font:800 1.65rem/1.2 'Baloo 2';margin:0 0 12px}.num{display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:white;border-radius:50%;width:40px;height:40px;margin-right:9px}.q{border:3px solid var(--line);border-radius:17px;padding:15px;margin:14px 0}.q p{font-weight:800;margin:0 0 10px}.option{display:block;width:100%;text-align:left;background:var(--bg);color:var(--fg);border:2px solid var(--line);box-shadow:none;margin:8px 0;font:700 .98rem Consolas,monospace;white-space:normal;overflow-wrap:anywhere}.option.correct{border-color:var(--ok);background:var(--okb)}.option.wrong{border-color:var(--bad);background:var(--badb)}.feedback{font-weight:800;margin-top:10px}.code{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code);color:var(--cf);padding:12px;border-radius:12px;font:600 .94rem/1.6 Consolas,monospace;margin:10px 0}.score{text-align:center;background:white;border-radius:23px;padding:25px;box-shadow:0 6px 0 var(--line);font:800 1.5rem 'Baloo 2'}[hidden]{display:none!important}.small{color:var(--mut);font-size:.95rem}.score button{margin-top:12px}@media(max-width:500px){section{padding:14px}.top{gap:7px}.top b,.top span{font-size:.85rem}}
</style></head><body><div class="top"><b>🌐 Atelier HTML</b><div class="bar"><i id="pg"></i></div><span id="tc">🎯 0/0</span></div><header class="hero"><div class="emoji">🧠🎨</div><h1>Recapitulare: lecția 2</h1><p>Liste, imagini, tabele și aranjarea paginii cu HTML și CSS. Citește, alege răspunsul corect și adună puncte!</p><button onclick="document.getElementById('quiz').scrollIntoView({behavior:'smooth'})">Începem! 👇</button></header><main><div id="quiz"></div><div id="score" class="score" hidden></div></main><script>
const groups=[['📝','Liste numerotate'],['🖼️','Imagini și atribute'],['▦','Tabele'],['📦','Blocuri și separatoare'],['🎨','Culori și aliniere'],['📐','Spațiere și legende'],['▥','Coloane și repararea codului']];
// [grup, întrebare, variante, index corect, explicație, cod opțional]
const Q=[
[0,'Ce etichetă creează o listă numerotată?',['<ul>','<ol>','<li>'],1,'<ol> înseamnă ordered list: o listă ordonată.'],
[0,'Ce etichetă reprezintă un element al unei liste?',['<li>','<ol>','<br>'],0,'Fiecare element se scrie între <li> și </li>.'],
[0,'Cum faci o listă numerotată cu litere mari A, B, C?',['<ol start="A">','<ol type="A">','<ul type="A">'],1,'Atributul type="A" schimbă tipul numerotării.'],
[0,'Ce afișează lista de mai jos?',['1. Ana, 2. Dan','5. Ana, 6. Dan','A. Ana, B. Dan'],1,'start="5" începe numerotarea de la 5.','<ol start="5">\n  <li>Ana</li>\n  <li>Dan</li>\n</ol>'],
[1,'Care este eticheta corectă pentru o imagine?',['<image>poza.png</image>','<img src="poza.png" alt="Peisaj">','<src>poza.png</src>'],1,'<img> este o etichetă fără închidere; src indică fișierul.'],
[1,'Ce reprezintă atributul src?',['Locul unde se găsește imaginea','Culoarea imaginii','Descrierea imaginii'],0,'src conține calea sau adresa imaginii.'],
[1,'De ce folosim atributul alt?',['Ca să mărim poza','Ca să descriem imaginea','Ca să o centrăm'],1,'alt oferă o descriere utilă când imaginea nu se vede și pentru accesibilitate.'],
[1,'Imaginea este în folderul poze. Care este calea corectă?',['src="pisica.png/poze"','src="poze/pisica.png"','src="poze"'],1,'Scriem mai întâi folderul, apoi numele fișierului.'],
[1,'Cum setezi lățimea imaginii la 150 pixeli?',['height="150"','width="150"','size="150"'],1,'width stabilește lățimea; înălțimea se ajustează proporțional dacă nu este fixată separat.'],
[1,'Ce greșeală există în cod?',['Lipsește </img>','Eticheta </img> nu trebuie scrisă','Lipsește <p>'],1,'img este o etichetă fără închidere.','<img src="floare.png" alt="Floare"></img>'],
[2,'Ce etichetă definește un tabel?',['<tr>','<td>','<table>'],2,'<table> conține rândurile tabelului.'],
[2,'Ce înseamnă <tr>?',['Un rând de tabel','O celulă de date','Titlul paginii'],0,'tr vine de la table row: rând de tabel.'],
[2,'Ce etichetă se folosește pentru o celulă de antet?',['<td>','<th>','<hr>'],1,'th este celula de antet, de obicei afișată îngroșat.'],
[2,'Câte coloane are tabelul?',['2 coloane','3 coloane','4 coloane'],0,'Primul rând are două celule th, deci două coloane.','<table>\n <tr><th>Nume</th><th>Nota</th></tr>\n <tr><td>Ana</td><td>10</td></tr>\n</table>'],
[2,'Care este ordinea corectă a etichetelor?',['<tr><table><td>','<table><tr><td>','<td><tr><table>'],1,'Tabelul conține rânduri, iar rândurile conțin celule.'],
[3,'La ce folosește <div>?',['Grupează elemente într-un bloc','Inserează o imagine','Creează automat un tabel'],0,'div este un container în care putem grupa alte elemente.'],
[3,'Ce face <hr>?',['Trece pe rândul următor','Inserează o linie orizontală','Îngroașă textul'],1,'hr separă vizual secțiunile printr-o linie.'],
[3,'Ce face <br>?',['Trece pe un rând nou','Creează un paragraf nou cu spațiu','Creează un chenar'],0,'br rupe rândul în interiorul aceluiași paragraf.'],
[3,'Care cod afișează orașul pe rândul următor?',['<p>Strada 5<br>Constanța</p>','<p>Strada 5<hr>Constanța</p>','<p>Strada 5<div>Constanța</p>'],0,'br este potrivit pentru o adresă scrisă pe două rânduri.'],
[4,'Cum centrezi textul unui titlu?',['style="text-align:center"','style="color:center"','style="align:middle"'],0,'text-align:center aliniază textul la centru.'],
[4,'Ce proprietate schimbă culoarea literelor?',['background-color','color','padding'],1,'color stabilește culoarea textului.'],
[4,'Ce proprietate schimbă culoarea fundalului?',['background-color','text-indent','margin-left'],0,'background-color stabilește fundalul elementului.'],
[4,'Ce culoare va avea textul?',['Roșu','Alb','Mov'],1,'color:white înseamnă text alb, iar background-color:purple înseamnă fundal mov.','<p style="color:white; background-color:purple">Salut!</p>'],
[4,'Cum separi două proprietăți în atributul style?',['Prin virgulă ,','Prin punct și virgulă ;','Prin semnul +'],1,'Proprietățile CSS se separă prin punct și virgulă.'],
[4,'Cum centrezi o imagine, după metoda învățată?',['Pui imaginea într-un p cu text-align:center','Scrii <img center>','Adaugi <center> în src'],0,'Imaginea este centrată prin alinierea conținutului părintelui.'],
[5,'Ce face padding?',['Adaugă spațiu în interiorul elementului','Mută doar primul rând','Adaugă spațiu doar în exterior'],0,'padding creează spațiu între conținut și marginea elementului.'],
[5,'Ce face margin-left?',['Mută elementul spre dreapta prin spațiu exterior în stânga','Schimbă culoarea textului','Centrează automat o imagine'],0,'margin-left adaugă spațiu exterior pe partea stângă.'],
[5,'Ce proprietate creează alineat la începutul paragrafului?',['text-align','text-indent','caption-side'],1,'text-indent deplasează primul rând al paragrafului.'],
[5,'Ce etichetă adaugă o legendă unei imagini în figure?',['<figcaption>','<caption>','<legend-img>'],0,'figcaption oferă legenda imaginii în interiorul unui figure.'],
[5,'Cum afișezi legenda tabelului dedesubt?',['caption-side:bottom','text-align:bottom','caption:under'],0,'Pe elementul caption folosim style="caption-side:bottom".'],
[6,'Ce proprietate așază două div-uri unul lângă altul?',['display:flex pe div-ul părinte','text-indent:2em','background-color:red'],0,'display:flex pe container așază copiii pe același rând, dacă au loc.'],
[6,'Ce face gap:16px într-un container flex?',['Adaugă spațiu între elemente','Face textul mai mare','Creează 16 coloane'],0,'gap controlează distanța dintre elementele flex.'],
[6,'Ce face flex-wrap:wrap?',['Permite elementelor să treacă pe rândul următor','Ascunde toate coloanele','Adaugă un tabel'],0,'flex-wrap:wrap permite mutarea elementelor când nu mai încap.'],
[6,'Ce este greșit în cod?',['Trebuie <ul> în loc de <ol>','Lista se închide cu </ul> în loc de </ol>','li nu se poate folosi în ol'],1,'O listă deschisă cu <ol> se închide cu </ol>.','<ol>\n <li>Pasul 1</li>\n <li>Pasul 2</li>\n</ul>'],
[6,'Cum centrezi un div cu lățime fixă?',['width:200px; margin:0 auto','width:200px; text-indent:center','gap:200px; color:auto'],0,'margin:0 auto distribuie automat spațiul orizontal pentru un bloc cu lățime stabilită.']
];
let done=0,first=0;const quiz=document.getElementById('quiz');function escapeHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function update(){document.getElementById('tc').textContent='🎯 '+done+'/'+Q.length;document.getElementById('pg').style.width=(done/Q.length*100)+'%'}function build(){done=0;first=0;quiz.innerHTML='';document.getElementById('score').hidden=true;update();let current=-1,section;Q.forEach((q,i)=>{if(q[0]!==current){current=q[0];section=document.createElement('section');section.style.setProperty('--ac','var(--c'+(current%5+1)+')');section.innerHTML='<h2><span class="num">'+(current+1)+'</span>'+groups[current][0]+' '+groups[current][1]+'</h2>';quiz.append(section)}const d=document.createElement('div');d.className='q';const title=document.createElement('p');title.textContent=(i+1)+'. '+q[1];d.append(title);if(q[5]){const code=document.createElement('div');code.className='code';code.textContent=q[5];d.append(code)}const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');let solved=false,attempts=0;const order=q[2].map((_,j)=>j);for(let j=order.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}order.forEach(k=>{const b=document.createElement('button');b.className='option';b.textContent=q[2][k];b.onclick=()=>{if(solved)return;if(k===q[3]){solved=true;b.classList.add('correct');if(attempts===0)first++;done++;feedback.style.color='var(--ok)';feedback.textContent='✅ Corect! '+q[4];d.querySelectorAll('button').forEach(x=>x.disabled=true);update();finish()}else{attempts++;b.classList.add('wrong');b.disabled=true;feedback.style.color='var(--bad)';feedback.textContent='❌ Nu este corect. Mai încearcă!'}};d.append(b)});d.append(feedback);section.append(d)})}function finish(){if(done!==Q.length)return;const s=document.getElementById('score');s.hidden=false;s.textContent='';const t=document.createElement('div');t.textContent=(first>=Q.length-3?'🏆':first>=Q.length*.65?'🎉':'💪')+' Corect din prima: '+first+' din '+Q.length+'. '+(first>=Q.length-3?'Excelent! Stăpânești lecția 2!':first>=Q.length*.65?'Foarte bine! Mai exersează întrebările dificile.':'Recitește lecția și mai încearcă!');s.append(t);const b=document.createElement('button');b.textContent='↺ Încearcă din nou';b.onclick=()=>{build();quiz.scrollIntoView({behavior:'smooth'})};s.append(b);s.scrollIntoView({behavior:'smooth',block:'center'})}build();
</script></body></html>
