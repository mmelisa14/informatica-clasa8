/* ===== diagrame ===== */
const COL=['--c1','--c2','--c3','--c4','--c5'];
const nice=v=>{for(const s of[1,2,5,10,20,50,100,200,500,1000])if(v/s<=5)return[s,Math.ceil(v/s)*s];return[2000,v]};
function chart(c){
 if(c.t=='p'){const tot=sum(c.d.map(d=>d[1]));let a=-Math.PI/2,s='';
  c.d.forEach((d,i)=>{const e=a+2*Math.PI*d[1]/tot;s+=`<path d="M95 95L${95+88*Math.cos(a)} ${95+88*Math.sin(a)}A88 88 0 ${e-a>Math.PI?1:0} 1 ${95+88*Math.cos(e)} ${95+88*Math.sin(e)}Z" fill="var(${COL[i]})" stroke="var(--sf)" stroke-width="2"/>`;a=e});
  return`<div class="cb"><b>${E(c.ti)}</b><div class="pie"><svg viewBox="0 0 190 190" role="img" aria-label="${E(c.ti)}">${s}</svg><ul>${c.d.map((d,i)=>`<li><i style="background:var(${COL[i]})"></i>${E(d[0])}: <b>${d[1]}%</b></li>`).join('')}</ul></div></div>`}
 const sc=c.t=='s',W=360,H=sc?240:210,l=34,r=12,t=30,b=sc?42:26,pw=W-l-r,ph=H-t-b,[st,top]=nice(Math.max(...c.d.map(d=>d[1]))),Y=v=>t+ph-ph*v/top;
 let s=`<text class="ct" x="${l}" y="16">${E(c.ti)}</text>`;
 for(let v=0;v<=top;v+=st)s+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${l-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
 if(c.t=='b'){const bw=pw/c.d.length;c.d.forEach((d,i)=>{const X=l+i*bw+bw*.18,w=bw*.64;s+=`<rect x="${X}" y="${Y(d[1])}" width="${w}" height="${ph*d[1]/top}" rx="2" fill="var(--c1)"/><text class="v" x="${X+w/2}" y="${Y(d[1])-4}" text-anchor="middle">${d[1]}</text><text x="${X+w/2}" y="${H-b+14}" text-anchor="middle">${E(d[0])}</text>`})}
 else if(c.t=='l'){const n=c.d.length,P=c.d.map((d,i)=>[l+(i+.5)*pw/n,Y(d[1])]);s+=`<polyline points="${P.join(' ')}" fill="none" stroke="var(--c1)" stroke-width="2.5"/>`;P.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--c1)"/><text class="v" x="${p[0]}" y="${p[1]-8}" text-anchor="middle">${c.d[i][1]}</text><text x="${p[0]}" y="${H-b+14}" text-anchor="middle">${E(c.d[i][0])}</text>`)}
 else{const xm=Math.ceil(Math.max(...c.d.map(d=>d[0]))),X=v=>l+pw*v/xm;for(let v=0;v<=xm;v++)s+=`<text x="${X(v)}" y="${H-b+14}" text-anchor="middle">${v}</text>`;
  s+=`<text x="${l+pw/2}" y="${H-6}" text-anchor="middle">${E(c.xl)}</text><text x="10" y="${t+ph/2}" text-anchor="middle" transform="rotate(-90 10 ${t+ph/2})">${E(c.yl)}</text>`;
  c.d.forEach(d=>s+=`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="4.5" fill="var(--c3)" stroke="var(--sf)" stroke-width="1.5"/>`)}
 return`<div class="cb"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${E(c.ti)}">${s}</svg></div>`}
/* ===== întrebări ===== */
function qm(q,t,mm,aw,qc){if(!mm.o)mm.o=sh([0,1,2,3]);
 let h=`<p class="q">${q.q}</p>`;if(q.ch!=null)h+=chart(t.ch[q.ch]);
 h+='<div class="opts">'+mm.o.map((oi,j)=>{const c=mm.k==null?'':oi==0?' ok':oi==mm.k?' no':'';return`<button class="opt${c}" data-o="${oi}"${mm.k!=null?' disabled':''}><span class="l">${'ABCD'[j]}</span><span class="${q.o[oi][0]=='='?'mo':''}">${E(q.o[oi])}</span></button>`}).join('')+'</div>';
 if(mm.k!=null)h+=`<div class="fb ${mm.k?'no':'ok'}"><b>${mm.k?'✗ Nu chiar. Răspunsul corect este marcat cu verde.':'✓ Corect!'}</b>${q.w}</div>`;
 qc.innerHTML=h;qc.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{mm.k=+b.dataset.o;aw(mm.k?0:1)})}
function qf(q,t,mm,aw,qc){const rows=t.sh,lk=mm.s||mm.sw,base=mk(rows,0,q.t),nc=Math.max(...rows.map(r=>r.length));
 qc.innerHTML=`<p class="q">${q.task}</p><div class="fx"><span class="nb"></span><span class="f">fx</span><input id="fi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Bara de formule" placeholder="Scrie formula, începând cu =" ${lk?'readonly':''}></div><div class="sb"><table class="g"><thead><tr><th></th>${Array.from({length:nc},(_,i)=>`<th>${CN(i+1)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><th>${i+1}</th>${Array.from({length:nc},(_,j)=>{const a=CN(j+1)+(i+1);return`<td data-a="${a}" class="${i?'':'h'}${a==q.t?' tg':''}"></td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="hl">Apasă celula galbenă, scrie formula și apasă Enter. Zecimalele se scriu cu punct (1.19), iar argumentele se despart prin virgulă.</p><div class="row"><button class="btn" id="ck"${lk?' disabled':''}>Verifică</button><button class="btn gh" id="hn"${lk?' disabled':''}>Ajutor</button><button class="btn gh" id="sw"${lk||mm.n<2||!mm.n?' hidden':''}>Arată răspunsul</button></div><div id="fb"></div>`;
 const inp=$('#fi',qc),nb=$('.nb',qc),tb=$('.g',qc);
 const paint=()=>{const c={...base};if(mm.v)c[q.t]=mm.v[0]=='='?mm.v:isNaN(mm.v)?mm.v:+mm.v;const s=calc(c);
  tb.querySelectorAll('td').forEach(td=>{const a=td.dataset.a,r=s(a);td.textContent=r.e?(a==q.t&&!lk?'':r.e):fmt(r.v);td.style.color=r.e?'var(--bad)':'';td.style.textAlign=typeof r.v=='number'?'right':''})};
 const sel=a=>{nb.textContent=a;tb.querySelectorAll('td').forEach(td=>td.classList.toggle('sel',td.dataset.a==a));
  if(a==q.t){inp.value=mm.v||'';inp.readOnly=!!lk}else{inp.value=base[a]==null?'':base[a];inp.readOnly=true}};
 tb.onclick=e=>{const td=e.target.closest('td');if(td)sel(td.dataset.a)};
 inp.oninput=()=>{if(nb.textContent==q.t&&!lk){mm.v=inp.value;paint()}};
 inp.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();$('#ck',qc).click()}};
 paint();sel(q.t);
 $('#fb',qc).innerHTML=mm.s?`<div class="fb ok"><b>✓ Corect!${mm.n>1?' Ai reușit după mai multe încercări: ½ punct.':''}</b>Formula se adaptează singură dacă se schimbă datele.</div>`:mm.sw?`<div class="fb no"><b>O formulă corectă este:</b><code>${E(q.s)}</code></div>`:(mm.msg?`<div class="fb no"><b>✗ Încă nu.</b>${mm.msg}</div>`:'')+(mm.hint?`<div class="fb hint"><b>Ajutor</b>${q.h}</div>`:'');
 $('#ck',qc).onclick=()=>{const r=chk(q,rows,mm.v||'');mm.n=(mm.n||0)+1;if(!r){mm.s=1;mm.msg=0;aw(mm.n==1?1:.5)}else{mm.msg=r;qf(q,t,mm,aw,qc);$('#fi',qc).focus()}};
 $('#hn',qc).onclick=()=>{mm.hint=1;qf(q,t,mm,aw,qc)};
 $('#sw',qc).onclick=()=>{mm.sw=1;mm.v=q.s;aw(0)}}
/* ===== aplicația ===== */
const app=$('#app'),nd=()=>({i:0,p:Array(12).fill(null),m:Array.from({length:12},()=>({}))});
let T=TESTS.map(nd),name='';
const nota=p=>Math.round((p*.75+1)*100)/100;
function home(){
 app.innerHTML=`<h1>Laborator Excel</h1><p class="s">Informatică, clasa a VIII-a · 5 teste · câte 12 întrebări</p><label class="nm">Numele tău<input id="nm" value="${E(name)}" placeholder="Prenume Nume" autocomplete="off"></label><p class="s">Alege un test: 5 grile, 3 grafice de interpretat și 4 formule de scris. Fiecare întrebare valorează 1 punct, iar nota este <b>puncte × 0,75 + 1</b>.</p><div class="cards">${TESTS.map((t,i)=>{const d=T[i],a=d.p.filter(v=>v!=null).length;return`<button class="tc" data-i="${i}"><b>${t.n}</b><small>${t.t}</small><span class="st">${d.fin?'Nota '+pf(nota(sum(d.p))):a?a+'/12 răspunsuri':'Nefăcut'}</span></button>`}).join('')}</div>`;
 $('#nm').oninput=e=>name=e.target.value;app.querySelectorAll('.tc').forEach(b=>b.onclick=()=>{test(+b.dataset.i);scrollTo(0,0)});scrollTo(0,0)}
function test(i){const t=TESTS[i],d=T[i];if(d.fin)return res(i);
 const k=d.i,q=t.q[k],y=scrollY,a=d.p.filter(v=>v!=null).length;
 app.innerHTML=`<div class="bar"><button class="btn gh" id="hm">← Teste</button><b>${t.n}</b><span class="sp"></span><span class="pc">${k+1}/12 · ${pf(sum(d.p))} p</span></div><div class="pg"><i style="width:${a/12*100}%"></i></div><div class="card" id="qc"></div><div class="row"><button class="btn gh" id="bk"${k?'':' disabled'}>← Înapoi</button><span class="sp"></span><button class="btn" id="nx"${d.p[k]==null?' disabled':''}>${k==11?'Vezi nota →':'Următoarea →'}</button></div>`;
 const aw=p=>{if(d.p[k]==null)d.p[k]=p;test(i)};
 (q.k=='m'?qm:qf)(q,t,d.m[k],aw,$('#qc'));
 $('#hm').onclick=home;$('#bk').onclick=()=>{d.i--;test(i);scrollTo(0,0)};$('#nx').onclick=()=>{if(k==11)d.fin=1;else d.i++;test(i);scrollTo(0,0)};scrollTo(0,y)}
function res(i){const t=TESTS[i],d=T[i],p=sum(d.p),n=nota(p),
 txt=`${name||'(fără nume)'} · ${t.n} · ${new Date().toLocaleDateString('ro-RO')}\n${pf(p)} puncte din 12 → ${pf(p)} × 0,75 + 1 = nota ${pf(n)}`;
 app.innerHTML=`<div class="bar"><button class="btn gh" id="hm">← Teste</button></div><div class="card"><div class="big">${pf(n)}</div><p class="q">${n>=9?'Excelent!':n>=7?'Foarte bine!':n>=5?'Bine, dar mai exersează.':'Mai ai de recapitulat.'}</p><p>${pf(p)} puncte din 12 → ${pf(p)} × 0,75 + 1 = <b>${pf(n)}</b></p><div class="dots">${d.p.map((v,j)=>`<span class="dt ${v==1?'':v==0?'no':'hf'}">${j+1}</span>`).join('')}</div><p class="hl">Verde = 1 punct · galben = ½ punct · roșu = 0 puncte</p><pre>${E(txt)}</pre><div class="row"><button class="btn" id="cp">Copiază rezultatul</button><span class="hl" id="cs" role="status"></span><span class="sp"></span><button class="btn gh" id="rs">Reia testul</button></div></div>`;
 $('#hm').onclick=home;$('#rs').onclick=()=>{T[i]=nd();test(i);scrollTo(0,0)};
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#cs').textContent='Copiat.'}catch(e){$('#cs').textContent='Selectează textul și copiază-l manual.'}};scrollTo(0,0)}
home();
})();
